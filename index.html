<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>自考英语专升本 · 阅读选择在线练习</title>
  <style>
    /* 全局样式与变量 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f7fb;
      color: #1e293b;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app {
      max-width: 1400px;
      width: 100%;
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 35px -8px rgba(0, 0, 0, 0.1);
      padding: 24px 20px 32px;
      margin-bottom: 20px;
    }

    /* 标题区 */
    .exam-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e9eef3;
    }

    .exam-header h1 {
      font-size: 1.7rem;
      font-weight: 600;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.01em;
    }

    .exam-header .session-label {
      background: #eef2ff;
      color: #1e3a8a;
      border-radius: 40px;
      padding: 8px 20px;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid #c7d2fe;
    }

    /* 两栏布局 —— 电脑端 6:4 */
    .two-columns {
      display: flex;
      gap: 28px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .article-col {
      flex: 6 1 0;
      min-width: 280px;
    }

    .quiz-col {
      flex: 4 1 0;
      min-width: 260px;
    }

    /* 文章卡片 */
    .article-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px 20px 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      border: 1px solid #e2e8f0;
      position: sticky;
      top: 20px;
    }

    .article-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .article-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0b2b4e;
      letter-spacing: -0.01em;
    }

    .translate-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #1e293b;
      padding: 8px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      white-space: nowrap;
    }

    .translate-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    .translate-btn.active {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1e40af;
    }

    /* 文章内容，段落颜色 */
    .article-content {
      font-size: 0.98rem;
      line-height: 1.7;
      color: #1e293b;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 8px;
      scrollbar-width: thin;
    }

    .article-content p {
      margin-bottom: 1.2em;
      padding: 10px 14px;
      border-radius: 14px;
      transition: background 0.2s;
    }

    /* 段落不同背景色 */
    .article-content p[data-para="0"] { background: #fef9e7; }
    .article-content p[data-para="1"] { background: #e8f0fe; }
    .article-content p[data-para="2"] { background: #f0fdf4; }
    .article-content p[data-para="3"] { background: #fdf2f8; }
    .article-content p[data-para="4"] { background: #f5f3ff; }
    .article-content p[data-para="5"] { background: #fff7ed; }
    .article-content p[data-para="6"] { background: #ecfeff; }
    .article-content p[data-para="7"] { background: #fef2f2; }
    .article-content p[data-para="8"] { background: #f7fee7; }
    .article-content p[data-para="9"] { background: #faf5ff; }

    /* 高亮来源句 */
    .source-highlight {
      background-color: #fde047 !important;
      box-shadow: 0 0 0 2px #eab308;
      border-radius: 6px;
      padding: 2px 4px;
      transition: background 0.2s;
      font-weight: 500;
    }

    /* 翻译句子显示 */
    .trans-sentence {
      display: block;
      margin-top: 8px;
      padding: 8px 12px;
      border-left: 3px solid #3b82f6;
      background: rgba(59, 130, 246, 0.06);
      font-size: 0.92rem;
      color: #2563eb;
      border-radius: 0 10px 10px 0;
    }

    .speaker-icon {
      display: inline-block;
      margin-left: 10px;
      font-size: 1rem;
      cursor: pointer;
      color: #4b5563;
      background: #f1f5f9;
      border-radius: 30px;
      padding: 4px 8px;
      vertical-align: middle;
      transition: 0.1s;
    }

    .speaker-icon:hover {
      background: #cbd5e1;
      color: #0f172a;
    }

    /* 右侧试题区 —— 增加独立滚动 */
    .quiz-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px 20px 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
      border: 1px solid #e2e8f0;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .quiz-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0b2b4e;
      margin-bottom: 18px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e9eef3;
      flex-shrink: 0;
    }

    /* 滚动容器：题目列表 */
    .questions-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      padding-right: 6px;
      margin-right: -6px;
      scrollbar-width: thin;
      min-height: 0;
    }

    .question-item {
      margin-bottom: 28px;
      padding: 16px 16px 12px;
      border-radius: 18px;
      transition: background 0.2s;
      border: 1px solid transparent;
    }

    /* 每道试题不同背景色 */
    .question-item[data-qindex="0"] { background: #fef9e7; border-color: #fde68a; }
    .question-item[data-qindex="1"] { background: #e8f0fe; border-color: #bfdbfe; }
    .question-item[data-qindex="2"] { background: #f0fdf4; border-color: #bbf7d0; }
    .question-item[data-qindex="3"] { background: #fdf2f8; border-color: #fbcfe8; }
    .question-item[data-qindex="4"] { background: #f5f3ff; border-color: #ddd6fe; }

    .q-text {
      font-weight: 600;
      margin-bottom: 14px;
      font-size: 1rem;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.95rem;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      transition: 0.1s;
    }

    .option:hover {
      background: rgba(255, 255, 255, 1);
      border-color: #94a3b8;
    }

    .option input[type="radio"] {
      margin-top: 3px;
      accent-color: #2563eb;
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .option label {
      flex: 1;
      cursor: pointer;
      line-height: 1.5;
    }

    /* 反馈框 */
    .feedback {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #1e293b;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: #ecfdf5;
      border-color: #a7f3d0;
    }

    .feedback.wrong {
      background: #fef2f2;
      border-color: #fecaca;
    }

    .feedback .detail {
      margin-top: 6px;
      color: #334155;
      line-height: 1.6;
    }

    /* 答案来源按钮 */
    .source-btn {
      margin-top: 10px;
      background: #ffffff;
      border: 1px solid #94a3b8;
      color: #1e293b;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .source-btn:hover {
      background: #f1f5f9;
      border-color: #3b82f6;
      color: #1e40af;
    }

    .source-btn.active {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1e40af;
    }

    .submit-btn {
      background: #1e3a8a;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 60px;
      cursor: pointer;
      width: 100%;
      margin-top: 16px;
      transition: background 0.2s;
      box-shadow: 0 6px 14px rgba(30, 58, 138, 0.25);
      flex-shrink: 0;
    }

    .submit-btn:hover {
      background: #1e40af;
    }

    .score-area {
      margin-top: 16px;
      font-weight: 600;
      text-align: center;
      color: #0f172a;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 40px;
      flex-shrink: 0;
    }

    /* 分页器 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .pagination button {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }

    .pagination button:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-input {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .page-input input {
      width: 70px;
      text-align: center;
      padding: 10px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 40px;
      font-size: 0.95rem;
      outline: none;
    }

    .page-input input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    /* 移动端调整 */
    @media (max-width: 800px) {
      .app {
        padding: 16px 12px;
      }
      .two-columns {
        flex-direction: column;
        gap: 20px;
      }
      .article-card {
        position: static;
      }
      .article-content {
        max-height: 50vh;
      }
      .quiz-card {
        max-height: none;
        overflow: visible;
      }
      .questions-scroll {
        overflow-y: visible;
        max-height: none;
      }
      .exam-header h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <!-- 动态渲染考试内容 -->
</div>

<!-- 分页器 (全局) -->
<div class="pagination" id="pagination">
  <button id="prevBtn" disabled>← 上一页</button>
  <div class="page-input">
    <span>第</span>
    <input type="number" id="pageInput" min="1" max="26" value="1" step="1">
    <span>/ 26 页</span>
  </div>
  <button id="nextBtn">下一页 →</button>
</div>

<!-- 引入翻译数据和题库数据（顺序很重要：先翻译，后题库） -->
<script src="translations.js"></script>
<script src="data.js"></script>

<script>
  // ============================================================
  // 状态管理
  // ============================================================
  let currentPage = 0;
  const totalPages = exams.length;

  // 用户答案：answers[pageIndex][questionIndex] = optionIndex (0-3)
  const userAnswers = exams.map(() => Array(5).fill(null));
  // 提交状态
  const submitted = exams.map(() => false);
  // 翻译显示状态
  const translateOn = exams.map(() => false);
  // 当前高亮来源的题目索引（null 表示无高亮）
  let activeSourceIndex = null;

  // ============================================================
  // 渲染当前页面
  // ============================================================
  function renderPage() {
    const exam = exams[currentPage];
    const app = document.getElementById('app');
    // 获取当前考期的翻译数据
    const translationDict = (typeof translationsMap !== 'undefined' && translationsMap[exam.session]) || {};

    // ============================
    // 构建文章 HTML
    // ============================
    let articleHtml = '';
    exam.articleParas.forEach((p) => {
      const paraText = p.text;
      if (translateOn[currentPage]) {
        // 翻译模式：按句子分割，逐句显示英文 + 发音 + 中文
        const sentences = paraText.match(/[^.!?]+[.!?]*/g) || [paraText];
        articleHtml += `<p data-para="${p.para}">`;
        sentences.forEach((sentence) => {
          const trimmed = sentence.trim();
          if (trimmed === '') return;
          // 检查是否需要高亮来源句
          let highlightClass = '';
          if (activeSourceIndex !== null && submitted[currentPage]) {
            const source = exam.questions[activeSourceIndex]?.sourceSentence || '';
            if (source && trimmed.includes(source.trim().slice(0, 30))) {
              highlightClass = 'source-highlight';
            } else if (source && source.includes(trimmed)) {
              highlightClass = 'source-highlight';
            }
          }
          articleHtml += `<span class="en-sentence ${highlightClass}">${trimmed}</span>`;
          articleHtml += `<span class="speaker-icon" onclick="speakText('${escapeForAttr(trimmed)}')">🔊</span>`;
          const translation = translationDict[trimmed];
          if (translation) {
            articleHtml += `<span class="trans-sentence">${translation}</span>`;
          } else {
            articleHtml += `<span class="trans-sentence" style="color:#9ca3af;">[翻译]</span>`;
          }
          articleHtml += '<br>';
        });
        articleHtml += `</p>`;
      } else {
        // 非翻译模式：直接显示段落，可能需要高亮部分句子
        let paraHtml = paraText;
        if (activeSourceIndex !== null && submitted[currentPage]) {
          const source = exam.questions[activeSourceIndex]?.sourceSentence || '';
          if (source) {
            const escapedSource = source.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escapedSource})`, 'gi');
            if (regex.test(paraText)) {
              paraHtml = paraText.replace(regex, '<span class="source-highlight">$1</span>');
            } else {
              const shortSource = source.slice(0, 30).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const shortRegex = new RegExp(`(${shortSource})`, 'gi');
              if (shortRegex.test(paraText)) {
                paraHtml = paraText.replace(shortRegex, '<span class="source-highlight">$1</span>');
              }
            }
          }
        }
        articleHtml += `<p data-para="${p.para}">${paraHtml}</p>`;
      }
    });

    // ============================
    // 构建试题 HTML
    // ============================
    let questionsHtml = '';
    exam.questions.forEach((q, qIdx) => {
      const userAns = userAnswers[currentPage][qIdx];
      const isSubmitted = submitted[currentPage];
      // 选项
      let optionsHtml = '';
      q.options.forEach((opt, optIdx) => {
        const checked = (userAns === optIdx) ? 'checked' : '';
        const disabled = isSubmitted ? 'disabled' : '';
        optionsHtml += `
          <div class="option">
            <input type="radio" name="q${currentPage}_${qIdx}" value="${optIdx}" id="q${currentPage}_${qIdx}_${optIdx}" ${checked} ${disabled} onchange="saveAnswer(${currentPage}, ${qIdx}, ${optIdx})">
            <label for="q${currentPage}_${qIdx}_${optIdx}">${opt}</label>
          </div>
        `;
      });

      // 反馈
      let feedbackHtml = '';
      if (isSubmitted) {
        const isCorrect = userAns === q.answer;
        const correctText = q.options[q.answer];
        const isActive = (activeSourceIndex === qIdx);
        feedbackHtml = `
          <div class="feedback show ${isCorrect ? 'correct' : 'wrong'}">
            <strong>${isCorrect ? '✅ 正确' : '❌ 错误'}</strong> 
            ${!isCorrect ? `正确答案：${correctText}` : ''}
            <div class="detail">${q.explanation}</div>
            <button class="source-btn ${isActive ? 'active' : ''}" onclick="showSource(${qIdx})">
              🔍 答案来源
            </button>
          </div>
        `;
      } else {
        feedbackHtml = `<div class="feedback"></div>`;
      }

      questionsHtml += `
        <div class="question-item" data-qindex="${qIdx}">
          <div class="q-text">${q.q}</div>
          <div class="options">${optionsHtml}</div>
          ${feedbackHtml}
        </div>
      `;
    });

    // ============================
    // 分数显示
    // ============================
    let scoreHtml = '';
    if (submitted[currentPage]) {
      const totalQuestions = exam.questions.length;
      let correctCount = 0;
      exam.questions.forEach((q, idx) => {
        if (userAnswers[currentPage][idx] === q.answer) correctCount++;
      });
      const score = correctCount * 2;
      scoreHtml = `<div class="score-area">得分：${score} / ${totalQuestions * 2} 分（答对 ${correctCount} 题）</div>`;
    } else {
      scoreHtml = `<div class="score-area" style="background:transparent; color:#64748b;">点击“提交答案”查看得分与解析</div>`;
    }

    const submitBtnText = submitted[currentPage] ? '已提交' : '提交答案';
    const submitDisabled = submitted[currentPage] ? 'disabled' : '';
    const translateActive = translateOn[currentPage] ? 'active' : '';
    const translateBtnText = translateOn[currentPage] ? '隐藏翻译' : '全文翻译';

    // ============================
    // 组装完整 HTML
    // ============================
    app.innerHTML = `
      <div class="exam-header">
        <h1>自考英语专升本 · 阅读选择</h1>
        <span class="session-label">${exam.session}</span>
      </div>
      <div class="two-columns">
        <div class="article-col">
          <div class="article-card">
            <div class="article-header">
              <span class="article-title">${exam.articleTitle}</span>
              <button class="translate-btn ${translateActive}" id="translateBtn" onclick="toggleTranslate()">${translateBtnText}</button>
            </div>
            <div class="article-content" id="articleContent">
              ${articleHtml}
            </div>
          </div>
        </div>
        <div class="quiz-col">
          <div class="quiz-card">
            <div class="quiz-title">阅读理解选择题（每题2分）</div>
            <div class="questions-scroll" id="questionsScroll">
              ${questionsHtml}
            </div>
            <button class="submit-btn" id="submitBtn" onclick="submitAnswers()" ${submitDisabled}>${submitBtnText}</button>
            ${scoreHtml}
          </div>
        </div>
      </div>
    `;

    // 如果高亮来源被激活，滚动到文章高亮处
    if (activeSourceIndex !== null && submitted[currentPage]) {
      setTimeout(() => {
        const highlightEl = document.querySelector('.source-highlight');
        if (highlightEl) {
          highlightEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }, 100);
    }

    // 更新分页器
    document.getElementById('pageInput').value = currentPage + 1;
    document.getElementById('prevBtn').disabled = (currentPage === 0);
    document.getElementById('nextBtn').disabled = (currentPage === totalPages - 1);
  }

  // ============================================================
  // 显示答案来源
  // ============================================================
  window.showSource = function(qIdx) {
    if (activeSourceIndex === qIdx) {
      activeSourceIndex = null;
    } else {
      activeSourceIndex = qIdx;
    }
    renderPage();
  };

  // ============================================================
  // 工具函数：转义属性中的引号
  // ============================================================
  function escapeForAttr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  // ============================================================
  // 语音朗读
  // ============================================================
  window.speakText = function(text) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    } else {
      alert('您的浏览器不支持语音朗读。');
    }
  };

  // ============================================================
  // 保存答案
  // ============================================================
  window.saveAnswer = function(pageIdx, qIdx, optIdx) {
    if (submitted[pageIdx]) return;
    userAnswers[pageIdx][qIdx] = optIdx;
  };

  // ============================================================
  // 提交答案
  // ============================================================
  window.submitAnswers = function() {
    if (submitted[currentPage]) return;
    submitted[currentPage] = true;
    activeSourceIndex = null;
    renderPage();
  };

  // ============================================================
  // 切换翻译
  // ============================================================
  window.toggleTranslate = function() {
    translateOn[currentPage] = !translateOn[currentPage];
    renderPage();
  };

  // ============================================================
  // 分页导航
  // ============================================================
  function goToPage(page) {
    if (page < 0 || page >= totalPages) return;
    currentPage = page;
    activeSourceIndex = null;
    renderPage();
  }

  // ============================================================
  // 初始化
  // ============================================================
  document.addEventListener('DOMContentLoaded', () => {
    // 动态更新分页器总数
    document.querySelector('.page-input span:last-child').textContent = `/ ${totalPages} 页`;
    document.getElementById('pageInput').max = totalPages;

    renderPage();

    document.getElementById('prevBtn').addEventListener('click', () => {
      goToPage(currentPage - 1);
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      goToPage(currentPage + 1);
    });
    document.getElementById('pageInput').addEventListener('change', (e) => {
      let val = parseInt(e.target.value, 10);
      if (isNaN(val)) val = 1;
      if (val < 1) val = 1;
      if (val > totalPages) val = totalPages;
      goToPage(val - 1);
      e.target.value = val;
    });
  });
</script>
</body>
</html>
